<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Store | Online Shopping</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #172033;
}

header {
  background: #111827;
  color: white;
  padding: 18px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.logo {
  font-size: 25px;
  font-weight: bold;
}

.cart-badge {
  background: #2563eb;
  padding: 10px 15px;
  border-radius: 8px;
  font-weight: bold;
}

.hero {
  padding: 45px 5%;
  background: linear-gradient(135deg, #172033, #2563eb);
  color: white;
}

.hero h1 {
  font-size: clamp(28px, 5vw, 42px);
  margin-bottom: 12px;
}

.hero p {
  line-height: 1.6;
  max-width: 550px;
}

main {
  width: 90%;
  max-width: 1200px;
  margin: 30px auto;
}

.search {
  width: 100%;
  padding: 14px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  margin-bottom: 18px;
  font-size: 16px;
}

.filters {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.filter {
  padding: 10px 17px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  background: white;
  cursor: pointer;
}

.filter.active {
  background: #2563eb;
  color: white;
  border-color: #2563eb;
}

#resultCount {
  margin-bottom: 18px;
  color: #64748b;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.card {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid #e5e7eb;
  box-shadow: 0 4px 15px rgba(0,0,0,.04);
}

.picture {
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f1f5f9;
  font-size: 65px;
  overflow: hidden;
}

.picture img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 12px;
}

.details {
  padding: 16px;
}

.category {
  font-size: 12px;
  color: #64748b;
  margin-bottom: 8px;
}

.details h3 {
  font-size: 18px;
  margin-bottom: 10px;
}

.price {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 16px;
}

.actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

button {
  font-family: inherit;
  cursor: pointer;
}

.add, .whatsapp {
  border: none;
  border-radius: 8px;
  padding: 11px 10px;
  font-weight: bold;
  flex: 1;
  font-size: 13px;
}

.add {
  background: #2563eb;
  color: white;
}

.whatsapp {
  background: #16a34a;
  color: white;
}

.quantity-control {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex: 1;
  background: #dcfce7;
  border-radius: 8px;
  padding: 5px;
}

.qty-btn {
  border: none;
  width: 30px;
  height: 30px;
  background: #16a34a;
  color: white;
  border-radius: 6px;
  font-size: 20px;
}

.qty-number {
  font-weight: bold;
  color: #166534;
}

.cart-box {
  background: white;
  border-radius: 14px;
  padding: 22px;
  margin-top: 35px;
  border: 1px solid #e5e7eb;
}

.cart-box h2 {
  margin-bottom: 12px;
}

#cartMessage {
  color: #64748b;
  margin-bottom: 15px;
}

#cartItems {
  list-style: none;
}

#cartItems li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  border-bottom: 1px solid #e5e7eb;
  padding: 12px 0;
}

.remove {
  background: #fee2e2;
  color: #b91c1c;
  border: none;
  padding: 7px 10px;
  border-radius: 6px;
}

.total {
  font-size: 21px;
  font-weight: bold;
  margin: 20px 0;
}

.checkout {
  width: 100%;
  padding: 14px;
  background: #16a34a;
  color: white;
  border: none;
  border-radius: 9px;
  font-size: 16px;
  font-weight: bold;
}

.empty {
  padding: 25px;
  background: white;
  border-radius: 10px;
  text-align: center;
}

footer {
  text-align: center;
  padding: 25px;
  margin-top: 35px;
  background: #111827;
  color: white;
}

@media (max-width: 480px) {
  main {
    width: 92%;
  }

  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .picture {
    height: 145px;
  }

  .details {
    padding: 11px;
  }

  .details h3 {
    font-size: 15px;
  }

  .price {
    font-size: 17px;
  }

  .actions {
    flex-wrap: wrap;
  }

  .whatsapp {
    flex-basis: 100%;
  }
}
</style>
</head>
