<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Store | Online Shopping</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #172033;
}

header {
  background: #111827;
  color: white;
  padding: 18px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.logo {
  font-size: 25px;
  font-weight: bold;
}

.cart-badge {
  background: #2563eb;
  padding: 10px 15px;
  border-radius: 8px;
  font-weight: bold;
}

.hero {
  padding: 45px 5%;
  background: linear-gradient(135deg, #172033, #2563eb);
  color: white;
}

.hero h1 {
  font-size: clamp(28px, 5vw, 42px);
  margin-bottom: 12px;
}

.hero p {
  line-height: 1.6;
  max-width: 550px;
}

main {
  width: 90%;
  max-width: 1200px;
  margin: 30px auto;
}

.search {
  width: 100%;
  padding: 14px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  margin-bottom: 18px;
  font-size: 16px;
}

.filters {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.filter {
  padding: 10px 17px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  background: white;
  cursor: pointer;
}

.filter.active {
  background: #2563eb;
  color: white;
  border-color: #2563eb;
}

#resultCount {
  margin-bottom: 18px;
  color: #64748b;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}

.card {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  border: 1px solid #e5e7eb;
  box-shadow: 0 4px 15px rgba(0,0,0,.04);
}

.picture {
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f1f5f9;
  font-size: 65px;
  overflow: hidden;
}

.picture img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  padding: 12px;
}

.details {
  padding: 16px;
}

.category {
  font-size: 12px;
  color: #64748b;
  margin-bottom: 8px;
}

.details h3 {
  font-size: 18px;
  margin-bottom: 10px;
}

.price {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 16px;
}

.actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

button {
  font-family: inherit;
  cursor: pointer;
}

.add, .whatsapp {
  border: none;
  border-radius: 8px;
  padding: 11px 10px;
  font-weight: bold;
  flex: 1;
  font-size: 13px;
}

.add {
  background: #2563eb;
  color: white;
}

.whatsapp {
  background: #16a34a;
  color: white;
}

.quantity-control {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex: 1;
  background: #dcfce7;
  border-radius: 8px;
  padding: 5px;
}

.qty-btn {
  border: none;
  width: 30px;
  height: 30px;
  background: #16a34a;
  color: white;
  border-radius: 6px;
  font-size: 20px;
}

.qty-number {
  font-weight: bold;
  color: #166534;
}

.cart-box {
  background: white;
  border-radius: 14px;
  padding: 22px;
  margin-top: 35px;
  border: 1px solid #e5e7eb;
}

.cart-box h2 {
  margin-bottom: 12px;
}

#cartMessage {
  color: #64748b;
  margin-bottom: 15px;
}

#cartItems {
  list-style: none;
}

#cartItems li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  border-bottom: 1px solid #e5e7eb;
  padding: 12px 0;
}

.remove {
  background: #fee2e2;
  color: #b91c1c;
  border: none;
  padding: 7px 10px;
  border-radius: 6px;
}

.total {
  font-size: 21px;
  font-weight: bold;
  margin: 20px 0;
}

.checkout {
  width: 100%;
  padding: 14px;
  background: #16a34a;
  color: white;
  border: none;
  border-radius: 9px;
  font-size: 16px;
  font-weight: bold;
}

.empty {
  padding: 25px;
  background: white;
  border-radius: 10px;
  text-align: center;
  grid-column: 1 / -1;
}

footer {
  text-align: center;
  padding: 25px;
  margin-top: 35px;
  background: #111827;
  color: white;
}

@media (max-width: 480px) {
  main {
    width: 92%;
  }

  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .picture {
    height: 145px;
  }

  .details {
    padding: 11px;
  }

  .details h3 {
    font-size: 15px;
  }

  .price {
    font-size: 17px;
  }

  .actions {
    flex-wrap: wrap;
  }

  .quantity-control {
    min-width: 100%;
  }

  .whatsapp {
    flex-basis: 100%;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Nova Store</div>

  <div class="cart-badge">
    🛒 Cart: <span id="cartCount">0</span>
  </div>
</header>

<section class="hero">
  <h1>Welcome to Nova Store</h1>
  <p>
    Discover everyday essentials at affordable prices.
    Choose your products, adjust quantities and send your
    order through WhatsApp.
  </p>
</section>

<main>

  <input
    id="search"
    class="search"
    type="search"
    placeholder="Search products..."
    aria-label="Search products"
  >

  <div class="filters">
    <button class="filter active" data-category="All">All</button>
    <button class="filter" data-category="Electronics">Electronics</button>
    <button class="filter" data-category="Accessories">Accessories</button>
  </div>

  <p id="resultCount"></p>

  <div class="grid" id="productGrid"></div>

  <section class="cart-box">
    <h2>Your Shopping Cart</h2>

    <p id="cartMessage">Your cart is empty.</p>

    <ul id="cartItems"></ul>

    <p class="total">
      Total: <span id="cartTotal">Rs. 0</span>
    </p>

    <button class="checkout" id="checkoutButton">
      Order via WhatsApp
    </button>
  </section>

</main>

<footer>
  <p>© 2026 Nova Store. All rights reserved.</p>
</footer>

<script>
"use strict";

// PRODUCT DATA
const products = [
  {
    id: 1,
    name: "Wireless Headphones",
    price: 2499,
    category: "Electronics",
    icon: "🎧",
    image: "images.jpg"
  },
  {
    id: 2,
    name: "Smart Watch",
    price: 3499,
    category: "Electronics",
    icon: "⌚",
    image: ""
  },
  {
    id: 3,
    name: "Everyday Backpack",
    price: 1799,
    category: "Accessories",
    icon: "🎒",
    image: ""
  },
  {
    id: 4,
    name: "Portable Speaker",
    price: 1999,
    category: "Electronics",
    icon: "🔊",
    image: ""
  },
  {
    id: 5,
    name: "Travel Bottle",
    price: 799,
    category: "Accessories",
    icon: "🧴",
    image: ""
  },
  {
    id: 6,
    name: "Phone Accessories",
    price: 999,
    category: "Accessories",
    icon: "📱",
    image: ""
  }
];

// SHOPPING CART
const cart = {};
let activeCategory = "All";

// WhatsApp number in international format
const whatsappNumber = "923362567984";

// FORMAT PRICE
function money(amount) {
  return "Rs. " + amount.toLocaleString("en-PK");
}

// FIND PRODUCT
function findProduct(id) {
  return products.find(product => product.id === Number(id));
}

// PRODUCT IMAGE OR FALLBACK ICON
function renderPicture(product) {
  if (product.image) {
    return `
      <img
        src="${product.image}"
        alt="${product.name}"
        onerror="
          this.style.display='none';
          this.nextElementSibling.style.display='block';
        "
      >
      <span style="display:none">${product.icon}</span>
    `;
  }

  return `<span>${product.icon}</span>`;
}

// DISPLAY PRODUCTS
function renderProducts() {
  const searchInput = document.getElementById("search");
  const searchText = searchInput.value.trim().toLowerCase();

  const filtered = products.filter(product => {
    const categoryMatch =
      activeCategory === "All" ||
      product.category === activeCategory;

    const searchMatch =
      product.name.toLowerCase().includes(searchText) ||
      product.category.toLowerCase().includes(searchText);

    return categoryMatch && searchMatch;
  });

  document.getElementById("resultCount").textContent =
    filtered.length + (filtered.length === 1 ? " product" : " products");

  const grid = document.getElementById("productGrid");

  if (filtered.length === 0) {
    grid.innerHTML = `
      <div class="empty">
        No products found. Try another search.
      </div>
    `;
    return;
  }

  grid.innerHTML = filtered.map(product => {
    const quantity = cart[product.id] || 0;

    return `
      <article class="card">

        <div class="picture">
          ${renderPicture(product)}
        </div>

        <div class="details">

          <p class="category">${product.category}</p>

          <h3>${product.name}</h3>

          <p class="price">${money(product.price)}</p>

          <div class="actions">

            ${
              quantity === 0
                ? `
                  <button
                    class="add"
                    data-add="${product.id}"
                  >
                    Add to Cart
                  </button>
                `
                : `
                  <div class="quantity-control">

                    <button
                      class="qty-btn"
                      data-minus="${product.id}"
                      aria-label="Decrease quantity"
                    >−</button>

                    <span class="qty-number">${quantity}</span>

                    <button
                      class="qty-btn"
                      data-plus="${product.id}"
                      aria-label="Increase quantity"
                    >+</button>

                  </div>
                `
            }

            <button
              class="whatsapp"
              data-order="${product.id}"
            >
              WhatsApp
            </button>

          </div>
        </div>
      </article>
    `;
  }).join("");
}

// DISPLAY CART
function renderCart() {
  const entries = Object.entries(cart)
    .filter(([, quantity]) => quantity > 0);

  const count = entries.reduce(
    (sum, [, quantity]) => sum + quantity,
    0
  );

  const total = entries.reduce((sum, [id, quantity]) => {
    const product = findProduct(id);

    return product
      ? sum + product.price * quantity
      : sum;
  }, 0);

  document.getElementById("cartCount").textContent = count;

  document.getElementById("cartTotal").textContent =
    money(total);

  document.getElementById("cartMessage").textContent =
    entries.length
      ? "Review your items below."
      : "Your cart is empty.";

  document.getElementById("cartItems").innerHTML =
    entries.map(([id, quantity]) => {
      const product = findProduct(id);

      if (!product) return "";

      return `
        <li>
          <span>
            ${product.name} × ${quantity}
            — ${money(product.price * quantity)}
          </span>

          <button
            class="remove"
            data-remove="${id}"
          >
            Remove
          </button>
        </li>
      `;
    }).join("");
}

// OPEN WHATSAPP
function openWhatsApp(message) {
  const url =
    "https://wa.me/" +
    whatsappNumber +
    "?text=" +
    encodeURIComponent(message);

  window.open(url, "_blank", "noopener,noreferrer");
}

// ADD ONE ITEM
function addToCart(id) {
  const product = findProduct(id);

  if (!product) return;

  cart[id] = (cart[id] || 0) + 1;

  renderProducts();
  renderCart();
}

// DECREASE ONE ITEM
function decreaseQuantity(id) {
  if (!cart[id]) return;

  cart[id]--;

  if (cart[id] <= 0) {
    delete cart[id];
  }

  renderProducts();
  renderCart();
}

// SEARCH PRODUCTS
document.getElementById("search").addEventListener(
  "input",
  renderProducts
);

// CATEGORY FILTERS
document.querySelectorAll(".filter").forEach(button => {
  button.addEventListener("click", () => {
    activeCategory = button.dataset.category;

    document.querySelectorAll(".filter").forEach(item => {
      item.classList.toggle("active", item === button);
    });

    renderProducts();
  });
});

// PRODUCT BUTTONS
document.getElementById("productGrid").addEventListener(
  "click",
  event => {
    const addButton = event.target.closest("[data-add]");
    const plusButton = event.target.closest("[data-plus]");
    const minusButton = event.target.closest("[data-minus]");
    const orderButton = event.target.closest("[data-order]");

    if (addButton) {
      addToCart(addButton.dataset.add);
      return;
    }

    if (plusButton) {
      addToCart(plusButton.dataset.plus);
      return;
    }

    if (minusButton) {
      decreaseQuantity(minusButton.dataset.minus);
      return;
    }

    if (orderButton) {
      const product = findProduct(orderButton.dataset.order);

      if (!product) return;

      openWhatsApp(
        "Hi, I am interested in " +
        product.name +
        " (" + money(product.price) + ")."
      );
    }
  }
);

// REMOVE ITEM FROM CART
document.getElementById("cartItems").addEventListener(
  "click",
  event => {
    const removeButton = event.target.closest("[data-remove]");

    if (!removeButton) return;

    delete cart[removeButton.dataset.remove];

    renderProducts();
    renderCart();
  }
);

// CHECKOUT ALL CART ITEMS
document.getElementById("checkoutButton").addEventListener(
  "click",
  () => {
    const entries = Object.entries(cart)
      .filter(([, quantity]) => quantity > 0);

    if (entries.length === 0) {
      alert("Your cart is empty. Add a product first.");
      return;
    }

    const lines = entries.map(([id, quantity]) => {
      const product = findProduct(id);

      return (
        product.name +
        " x " + quantity +
        " = " + money(product.price * quantity)
      );
    });

    const total = entries.reduce((sum, [id, quantity]) => {
      const product = findProduct(id);

      return sum + product.price * quantity;
    }, 0);

    const message =
      "Hi, I would like to order:\n\n" +
      lines.join("\n") +
      "\n\nTotal: " + money(total);

    openWhatsApp(message);
  }
);

// INITIAL DISPLAY
renderProducts();
renderCart();
</script>

</body>
</html>
